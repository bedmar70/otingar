<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Otingar - Crear Elementos</title>
    <style>
        /* ESTILOS CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 800px; width: 100%; padding: 40px; }
        h1 { color: #1a202c; font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        .logo { font-size: 48px; text-align: center; display: block; margin-bottom: 16px; }
        .subtitle { color: #718096; font-size: 14px; text-align: center; margin-bottom: 32px; display: block;}
        .form-group { margin-bottom: 24px; }
        label { display: block; color: #2d3748; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .required { color: #e53e3e; }
        input, select, textarea { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        
        /* GASTOS */
        #bloqueGastos { display: none; background: #f0f4ff; padding: 20px; border-radius: 8px; border: 1px solid #c3dafe; margin-bottom: 24px; }
        .gastos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* LOOKUP */
        .lookup-container { position: relative; }
        .lookup-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid #e2e8f0; border-top: none; max-height: 200px; overflow-y: auto; z-index: 100; display: none; }
        .lookup-results.active { display: block; }
        .lookup-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .lookup-item:hover { background: #f7fafc; }
        .lookup-selected { display: none; background: #edf2f7; padding: 8px; margin-top: 5px; border-radius: 4px; justify-content: space-between; align-items: center; }
        .lookup-selected.active { display: flex; }
        .lookup-clear { background: #e53e3e; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* BUTTONS & ALERTS */
        .btn { padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn:disabled { opacity: 0.7; cursor: wait; }
        
        /* NUEVOS ESTILOS ALERTAS MEJORADOS */
        .alert { padding: 15px; border-radius: 8px; margin-top: 20px; display: none; line-height: 1.5; }
        .alert-success { background: #c6f6d5; color: #22543d; border-left: 5px solid #38a169; }
        .alert-error { background: #fed7d7; color: #742a2a; border-left: 5px solid #e53e3e; }
        .alert.active { display: block; }
        
        /* HELPERS */
        .help-text { font-size: 12px; color: #718096; margin-top: 4px; }
        .file-upload-area { border: 2px dashed #cbd5e0; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; }
        .file-list { margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">🏗️</span>
        <h1>Crear Elemento ClickUp</h1>
        <span class="subtitle">Otingar - Sistema de Gestión</span>

        <form id="mainForm">
            <div class="form-group">
                <label>Nombre de la Tarea <span class="required">*</span></label>
                <input type="text" id="nombreTarea" name="nombre_tarea" required placeholder="Resumen breve...">
            </div>

            <div class="form-group">
                <label>Descripción <span class="required">*</span></label>
                <textarea id="descripcion" name="descripcion" required placeholder="Detalles..."></textarea>
            </div>

            <div class="form-group">
                <label>Tipo de Tarea</label>
                <select id="tipoTarea" name="task_type_id">
                    <option value="" selected>Tarea (Estándar)</option>
                    <option value="1022">Gasto 🛒</option>
                </select>
                <p class="help-text">Selecciona 'Gasto' para imputar costes.</p>
            </div>

            <div id="bloqueGastos">
                <div class="form-group">
                    <label>Concepto Gasto</label>
                    <select id="tipoGastoSelect">
                        <option value="">-- Seleccionar --</option>
                        <option value="be8c9f4e-a05b-47a7-87e4-7ae49a3e1736">KMS</option>
                        <option value="a29ded5a-543e-47f1-bef4-c5ba6eafd62c">COMIDAS</option>
                        <option value="4c4176fa-8dd2-46ad-92e5-edb96d4d0411">ALOJAMIENTO</option>
                        <option value="9b19e9d7-3fb9-44a2-b79b-34eff81c2860">OTROS</option>
                    </select>
                </div>
                <div class="gastos-grid">
                    <div class="form-group">
                        <label>Importe (€)</label>
                        <input type="number" id="importeGasto" step="0.01">
                    </div>
                    <div class="form-group" id="kmsWrapper" style="display:none;">
                        <label>Kilómetros</label>
                        <input type="number" id="kmsGasto" step="0.1">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Horas Incurridas</label>
                <div style="position:relative;">
                    <input type="number" id="horas_trackeadas" step="0.25" placeholder="Ej: 1.5">
                    <span style="position:absolute; right:10px; top:12px;">⏱️</span>
                </div>
                <p class="help-text">Deja vacío si no aplica.</p>
            </div>

            <div class="form-group">
                <label>Expediente Relacionado</label>
                <div class="lookup-container">
                    <input type="text" id="expedienteSearch" placeholder="🔍 Buscar expediente..." autocomplete="off">
                    <div id="expedienteResults" class="lookup-results"></div>
                    <div id="expedienteSelected" class="lookup-selected">
                        <span id="expedienteSelectedText"></span>
                        <button type="button" class="lookup-clear" id="expedienteClear">✕</button>
                    </div>
                </div>
                <input type="hidden" id="expedienteId">
                <input type="hidden" id="expedienteListId">
                <p class="help-text">Si no seleccionas nada, irá a la lista 'Equipo'.</p>
            </div>

            <div class="form-group">
                <label>Responsable</label>
                <select id="responsableSelect">
                    <option value="">Cargando lista...</option>
                </select>
                <p class="help-text">Se cargan desde ClickUp.</p>
            </div>

            <div class="form-group">
                <label>Fecha Límite</label>
                <input type="date" id="fechaLimite">
            </div>

            <div class="form-group">
                <div class="file-upload-area" id="dropZone">
                    <p>📂 Arrastra archivos aquí</p>
                    <input type="file" id="fileInput" multiple style="display:none;">
                </div>
                <div id="fileList" class="file-list"></div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Crear Tarea</button>

            <div id="alertSuccess" class="alert alert-success"></div>
            <div id="alertError" class="alert alert-error">❌ Error al crear la tarea</div>

        </form>
    </div>

    <script>
        // === CONFIGURACIÓN ===
        const CONFIG = {
            // URL DEL WEBHOOK QUE ACEPTA GET (USUARIOS)
            obtenerUsuariosUrl: 'https://n8n.escueladeefectividad.com/webhook/obtener-usuarios',
            // URL DEL WEBHOOK PRINCIPAL (CREAR TAREA)
            crearTareaUrl: 'https://n8n.escueladeefectividad.com/webhook/crear-tarea',
            // URL DE BUSQUEDA EXPEDIENTES
            buscarExpedientesUrl: 'https://n8n.escueladeefectividad.com/webhook/buscar-expedientes',
            
            maxFiles: 10,
            maxFileSize: 10 * 1024 * 1024 // 10MB
        };

        // === VARIABLES GLOBALES ===
        let selectedFiles = [];
        let debounceTimer;

        // === ELEMENTOS DOM ===
        const form = document.getElementById('mainForm');
        const tipoTarea = document.getElementById('tipoTarea');
        const bloqueGastos = document.getElementById('bloqueGastos');
        const tipoGasto = document.getElementById('tipoGastoSelect');
        const kmsWrapper = document.getElementById('kmsWrapper');
        const responsableSelect = document.getElementById('responsableSelect');
        const submitBtn = document.getElementById('submitBtn');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');

        // === CARGA INICIAL (USUARIOS) ===
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Iniciando aplicación...");
            cargarUsuarios();
        });

        async function cargarUsuarios() {
            try {
                // Usamos GET
                const response = await fetch(CONFIG.obtenerUsuariosUrl, { 
                    method: 'GET', 
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
                
                const data = await response.json();

                if (data.usuarios && data.usuarios.length > 0) {
                    let html = '<option value="">-- Sin asignar --</option>';
                    data.usuarios.forEach(u => {
                        html += `<option value="${u.id}">${u.username || u.name}</option>`;
                    });
                    responsableSelect.innerHTML = html;
                } else {
                    responsableSelect.innerHTML = '<option value="">No hay usuarios disponibles</option>';
                }

            } catch (error) {
                console.error("Error usuarios:", error);
                responsableSelect.innerHTML = '<option value="">⚠️ Error cargando</option><option value="4607189">Jesús (Fallback)</option>';
            }
        }

        // === LÓGICA DE INTERFAZ ===
        tipoTarea.addEventListener('change', (e) => {
            if(e.target.value.includes('1022')) { // ID de Gasto
                bloqueGastos.style.display = 'block';
                tipoGasto.required = true;
            } else {
                bloqueGastos.style.display = 'none';
                tipoGasto.required = false;
                tipoGasto.value = "";
                document.getElementById('kmsGasto').value = "";
                document.getElementById('importeGasto').value = "";
                kmsWrapper.style.display = 'none';
            }
        });

        tipoGasto.addEventListener('change', (e) => {
            if(e.target.value === 'be8c9f4e-a05b-47a7-87e4-7ae49a3e1736') {
                kmsWrapper.style.display = 'block';
            } else {
                kmsWrapper.style.display = 'none';
            }
        });

        // === EXPEDIENTES ===
        const expInput = document.getElementById('expedienteSearch');
        const expResults = document.getElementById('expedienteResults');
        const expSelected = document.getElementById('expedienteSelected');
        
        expInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => buscarExpedientes(e.target.value), 300);
        });

        async function buscarExpedientes(keyword) {
            if(keyword.length < 2) { expResults.style.display = 'none'; return; }
            expResults.innerHTML = '<div class="lookup-item">Buscando...</div>';
            expResults.style.display = 'block';

            try {
                const res = await fetch(CONFIG.buscarExpedientesUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({keyword})
                });
                const data = await res.json();
                
                if(data.expedientes && data.expedientes.length > 0) {
                    expResults.innerHTML = data.expedientes.map(exp => `
                        <div class="lookup-item" onclick="selectExp('${exp.id}', '${exp.name.replace(/'/g, "\\'")}', '${exp.list.id}')">
                            <strong>${exp.name}</strong><br>
                            <small>${exp.list.name} • ${exp.status}</small>
                        </div>
                    `).join('');
                } else {
                    expResults.innerHTML = '<div class="lookup-item">No encontrado</div>';
                }
            } catch(e) {
                console.error(e);
                expResults.innerHTML = '<div class="lookup-item">Error busqueda</div>';
            }
        }

        window.selectExp = (id, name, listId) => {
            document.getElementById('expedienteId').value = id;
            document.getElementById('expedienteListId').value = listId;
            document.getElementById('expedienteSelectedText').innerText = name;
            expInput.style.display = 'none';
            expResults.style.display = 'none';
            expSelected.style.display = 'flex';
        };

        document.getElementById('expedienteClear').addEventListener('click', () => {
            document.getElementById('expedienteId').value = "";
            document.getElementById('expedienteListId').value = "";
            expInput.value = "";
            expInput.style.display = 'block';
            expSelected.style.display = 'none';
        });

        // === ARCHIVOS ===
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        function handleFiles(files) {
            Array.from(files).forEach(f => selectedFiles.push(f));
            renderFiles();
        }
        
        function renderFiles() {
            const list = document.getElementById('fileList');
            if(selectedFiles.length === 0) { list.innerHTML = ""; return; }
            list.innerHTML = selectedFiles.map((f, i) => `
                <div>${f.name} <span style="color:red;cursor:pointer;margin-left:5px;" onclick="removeFile(${i})">✕</span></div>
            `).join('');
        }
        window.removeFile = (index) => {
            selectedFiles.splice(index, 1);
            renderFiles();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // === ENVIAR FORMULARIO (LOGICA PRINCIPAL) ===
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Reset
            submitBtn.disabled = true;
            submitBtn.innerText = "Enviando...";
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';

            try {
                const formData = new FormData();
                
                // 1. CAMPOS BÁSICOS
                formData.append('nombre_tarea', document.getElementById('nombreTarea').value);
                formData.append('descripcion', document.getElementById('descripcion').value);
                
                // Tipo y Gastos
                const typeId = tipoTarea.value;
                if(typeId) formData.append('task_type_id', typeId);

                if(bloqueGastos.style.display !== 'none' && tipoGasto.value) {
                    formData.append('custom_field_gasto_id', '81472277-44f0-434b-aa89-93b64cfd39b6');
                    formData.append('custom_field_gasto_value', tipoGasto.value);
                    const imp = document.getElementById('importeGasto').value;
                    if(imp) {
                        formData.append('custom_field_importe_id', 'ccf0cff1-3c0a-46d5-b910-ff0e6316e154');
                        formData.append('custom_field_importe_value', imp);
                    }
                    const kms = document.getElementById('kmsGasto').value;
                    if(kms && kmsWrapper.style.display !== 'none') {
                        formData.append('custom_field_kms_id', '450df9dc-d862-4059-a24e-eadcc69087d6');
                        formData.append('custom_field_kms_value', kms);
                    }
                }

                // >>> NUEVO: HORAS INCURRIDAS <<<
                const horasVal = document.getElementById('horas_trackeadas').value;
                if (horasVal) {
                    formData.append('horas_trackeadas', horasVal);
                }

                // Expediente
                const expId = document.getElementById('expedienteId').value;
                if(expId) {
                    formData.append('expediente_id', expId);
                    formData.append('expediente_list_id', document.getElementById('expedienteListId').value);
                }

                // Asignado
                const assignee = responsableSelect.value;
                if(assignee) formData.append('assignee_id', assignee);

                // Fecha
                const fecha = document.getElementById('fechaLimite').value;
                if(fecha) formData.append('fecha_limite', fecha);

                // Archivos
                selectedFiles.forEach((f, i) => formData.append(`archivo_${i}`, f));
                formData.append('total_archivos', selectedFiles.length);

                // 2. LLAMADA AL SERVIDOR
                const res = await fetch(CONFIG.crearTareaUrl, {
                    method: 'POST',
                    body: formData
                });

                if(!res.ok) throw new Error("Error en el servidor");

                // 3. PROCESAR RESPUESTA EXITOSA
                const result = await res.json();
                
                // Pintar mensaje bonito
                alertSuccess.style.display = 'block';
                alertSuccess.innerHTML = `
                    ✅ <strong>¡Tarea creada con éxito!</strong><br>
                    🆔 ID: <strong>#${result.taskId || '---'}</strong><br>
                    🔗 <a href="${result.url}" target="_blank" style="color: #22543d; font-weight: bold; text-decoration: underline;">
                        Abrir tarea en ClickUp
                    </a>
                `;

                // 4. LIMPIEZA
                form.reset();
                selectedFiles = [];
                renderFiles();
                
                // Resets manuales
                if(responsableSelect.options.length > 0) responsableSelect.selectedIndex = 0;
                document.getElementById('expedienteClear').click();
                bloqueGastos.style.display = 'none';
                tipoTarea.value = "";

            } catch (e) {
                console.error(e);
                alertError.style.display = 'block';
                alertError.innerHTML = `❌ Error: No se pudo conectar con N8N o el flujo falló.`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Crear Tarea";
            }
        });
    </script>
</body>
</html>
